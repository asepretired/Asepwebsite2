<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asep Scoring - Device Benchmark</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #ff4136;
            --primary-glow: rgba(255, 65, 54, 0.4);
            --cpu-color: #00f0ff;
            --gpu-color: #ff0070;
            --mem-color: #ffe600;
            --ux-color: #00ff66;
            --text: #ffffff;
            --text-dim: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 65, 54, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ff4136, #ff725c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .device-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .specs-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .specs-panel span {
            color: var(--text);
            font-weight: 600;
        }

        .score-circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .score-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 10;
        }

        .circle-progress {
            fill: none;
            stroke: url(#scoreGrad);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.4s ease;
        }

        .score-center {
            text-align: center;
            z-index: 2;
        }

        .score-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .score-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .tier-badge {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255, 65, 54, 0.2);
            color: #ff4136;
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            height: 110px;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gpu-canvas {
            width: 100%;
            height: 100%;
        }

        .status-overlay {
            position: absolute;
            font-size: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .subscores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .sub-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .sub-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .cpu-t { color: var(--cpu-color); }
        .gpu-t { color: var(--gpu-color); }
        .mem-t { color: var(--mem-color); }
        .ux-t  { color: var(--ux-color); }

        .btn-action {
            width: 100%;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff4136, #e71d36);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 65, 54, 0.6);
        }

        .btn-action:disabled {
            background: #2a3342;
            box-shadow: none;
            cursor: not-allowed;
            color: #5d6b82;
            transform: none;
        }

        /* Hidden stress test container for UX reflow tests */
        #dom-sandbox {
            position: absolute;
            left: -9999px;
            width: 100px;
            height: 100px;
            opacity: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            ASEP SCORING
        </div>
        <div class="device-badge" id="os-name">Deteksi...</div>
    </header>

    <div class="specs-panel">
        <div>Cores: <span id="cpu-cores">-</span></div>
        <div>RAM: <span id="device-ram">-</span></div>
        <div>Layar: <span id="screen-res">-</span></div>
        <div>Platform: <span id="platform-info">-</span></div>
    </div>

    <div class="score-circle-container">
        <svg class="score-svg" viewBox="0 0 200 200">
            <defs>
                <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff4136" />
                    <stop offset="50%" stop-color="#ff0070" />
                    <stop offset="100%" stop-color="#00f0ff" />
                </linearGradient>
            </defs>
            <circle class="circle-bg" cx="100" cy="100" r="90" />
            <circle class="circle-progress" id="circle-bar" cx="100" cy="100" r="90" />
        </svg>
        <div class="score-center">
            <div class="score-val" id="total-score">0</div>
            <div class="score-label">Total Score</div>
            <div class="tier-badge" id="tier-badge">READY</div>
        </div>
    </div>

    <!-- Live Viewport for GPU Graphics Stress -->
    <div class="viewport-wrapper">
        <canvas id="gpu-canvas"></canvas>
        <div class="status-overlay" id="test-status">STANDBY</div>
    </div>

    <!-- Subscore Metrics -->
    <div class="subscores">
        <div class="sub-card">
            <div class="sub-header cpu-t"><span>CPU</span> <span>⚡</span></div>
            <div class="sub-val cpu-t" id="score-cpu">0</div>
        </div>
        <div class="sub-card">
            <div class="sub-header gpu-t"><span>GPU</span> <span>🎮</span></div>
            <div class="sub-val gpu-t" id="score-gpu">0</div>
        </div>
        <div class="sub-card">
            <div class="sub-header mem-t"><span>MEM</span> <span>💾</span></div>
            <div class="sub-val mem-t" id="score-mem">0</div>
        </div>
        <div class="sub-card">
            <div class="sub-header ux-t"><span>UX</span> <span>📱</span></div>
            <div class="sub-val ux-t" id="score-ux">0</div>
        </div>
    </div>

    <button class="btn-action" id="start-btn" onclick="startBenchmark()">RUN TEST</button>
</div>

<div id="dom-sandbox"></div>

<script>
    // --- Device Detection ---
    document.getElementById('cpu-cores').innerText = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Thread` : '4 (Est.)';
    document.getElementById('device-ram').innerText = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : 'N/A';
    document.getElementById('screen-res').innerText = `${window.screen.width * window.devicePixelRatio}x${window.screen.height * window.devicePixelRatio}`;
    
    const ua = navigator.userAgent;
    let platform = "Browser";
    if (/Android/i.test(ua)) platform = "Android";
    else if (/iPhone|iPad|iPod/i.test(ua)) platform = "iOS";
    else if (/Windows/i.test(ua)) platform = "Windows";
    else if (/Macintosh/i.test(ua)) platform = "macOS";
    else if (/Linux/i.test(ua)) platform = "Linux";
    
    document.getElementById('os-name').innerText = platform;
    document.getElementById('platform-info').innerText = platform;

    // --- Benchmark Logic ---
    const canvas = document.getElementById('gpu-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('test-status');
    const circleBar = document.getElementById('circle-bar');
    const totalCircumference = 2 * Math.PI * 90; // r=90

    function setProgress(percent) {
        const offset = totalCircumference - (percent / 100 * totalCircumference);
        circleBar.style.strokeDashoffset = offset;
    }

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Helper: Async pause agar browser bisa render UI
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Animasi counter angka
    function animateCounter(elementId, targetVal, duration = 1000) {
        const el = document.getElementById(elementId);
        const startTime = performance.now();
        const startVal = parseInt(el.innerText.replace(/,/g, '')) || 0;

        function update(currentTime) {
            const progress = Math.min((currentTime - startTime) / duration, 1);
            const current = Math.floor(startVal + (targetVal - startVal) * progress);
            el.innerText = current.toLocaleString('id-ID');
            if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    }

    // 1. CPU TEST: Prime numbers + Complex Math stress loops
    async function testCPU() {
        statusText.innerText = "TESTING: CPU MATH & LOGIC";
        await sleep(100);

        const duration = 2500; // 2.5 detik stress
        const start = performance.now();
        let operations = 0;

        while (performance.now() - start < duration) {
            // Kombinasi Trigonometri, Matrix mini & Sqrt
            for (let i = 0; i < 5000; i++) {
                Math.sin(i) * Math.cos(i) + Math.sqrt(i * 1.5);
                operations++;
            }
            // Yield sesaat agar UI tidak crash
            if (operations % 500000 === 0) await sleep(0);
        }

        // Kalkulasi skor setara ponsel/PC skala Antutu
        const rawScore = Math.floor((operations / duration) * 45);
        return rawScore;
    }

    // 2. GPU TEST: Canvas 2D Particle Storm & Physics Stress
    async function testGPU() {
        statusText.innerText = "TESTING: GPU RENDER 3D";
        
        const particleCount = 1200;
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                size: Math.random() * 3.5 + 1,
                color: `hsl(${Math.random() * 360}, 90%, 60%)`
            });
        }

        let frames = 0;
        const duration = 3000;
        const start = performance.now();

        return new Promise((resolve) => {
            function render() {
                const now = performance.now();
                if (now - start >= duration) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const fps = (frames / (duration / 1000));
                    // Skor GPU dipengaruhi stabilitas FPS & resolusi
                    const score = Math.floor(fps * particleCount * 2.8);
                    resolve(score);
                    return;
                }

                // Render stress simulation
                ctx.fillStyle = 'rgba(7, 9, 14, 0.25)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }

                frames++;
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        });
    }

    // 3. MEMORY TEST: High Volume TypedArray Allocation & Sort
    async function testMEM() {
        statusText.innerText = "TESTING: MEMORY SPEED";
        await sleep(100);

        const duration = 1800;
        const start = performance.now();
        let totalAllocatedMB = 0;

        while (performance.now() - start < duration) {
            // Allocate 1 Juta 64-bit float (~8MB per batch)
            const arr = new Float64Array(1000000);
            for (let i = 0; i < 50000; i++) {
                arr[i] = Math.random();
            }
            arr.sort();
            totalAllocatedMB += 8;
            await sleep(0);
        }

        const score = Math.floor(totalAllocatedMB * 140);
        return score;
    }

    // 4. UX TEST: DOM Tree Mutation, Reflow & Layout Thrashing
    async function testUX() {
        statusText.innerText = "TESTING: UX & REFLOW";
        const sandbox = document.getElementById('dom-sandbox');
        const duration = 1500;
        const start = performance.now();
        let domOperations = 0;

        while (performance.now() - start < duration) {
            const div = document.createElement('div');
            div.style.cssText = `width:${Math.random()*50}px;height:${Math.random()*50}px;transform:scale(${Math.random()});`;
            sandbox.appendChild(div);
            // Force browser reflow
            const _ = sandbox.offsetHeight;
            if (sandbox.children.length > 50) {
                sandbox.innerHTML = '';
            }
            domOperations++;
            if (domOperations % 30 === 0) await sleep(0);
        }
        sandbox.innerHTML = '';

        const score = Math.floor(domOperations * 120);
        return score;
    }

    // --- Main Controller ---
    async function startBenchmark() {
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        btn.innerText = "BENCHMARKING...";

        // Reset display
        ['total-score', 'score-cpu', 'score-gpu', 'score-mem', 'score-ux'].forEach(id => {
            document.getElementById(id).innerText = '0';
        });
        document.getElementById('tier-badge').innerText = 'BENCHMARKING';
        setProgress(5);

        // 1. CPU
        const cpuScore = await testCPU();
        animateCounter('score-cpu', cpuScore);
        setProgress(28);

        // 2. GPU
        const gpuScore = await testGPU();
        animateCounter('score-gpu', gpuScore);
        setProgress(58);

        // 3. MEM
        const memScore = await testMEM();
        animateCounter('score-mem', memScore);
        setProgress(82);

        // 4. UX
        const uxScore = await testUX();
        animateCounter('score-ux', uxScore);
        setProgress(100);

        // Total
        const total = cpuScore + gpuScore + memScore + uxScore;
        animateCounter('total-score', total, 1500);

        // Tier classification ala AnTuTu
        const tierBadge = document.getElementById('tier-badge');
        if (total >= 1000000) {
            tierBadge.innerText = 'GOD TIER / FLAGSHIP';
            tierBadge.style.color = '#00f0ff';
        } else if (total >= 600000) {
            tierBadge.innerText = 'HIGH-END';
            tierBadge.style.color = '#00ff66';
        } else if (total >= 300000) {
            tierBadge.innerText = 'MID-RANGE';
            tierBadge.style.color = '#ffe600';
        } else {
            tierBadge.innerText = 'ENTRY LEVEL';
            tierBadge.style.color = '#ff4136';
        }

        statusText.innerText = "TEST COMPLETE";
        btn.disabled = false;
        btn.innerText = "TEST LAGI";
    }
</script>

</body>
</html>
