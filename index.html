<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asep Scoring - Accurate Device Benchmark</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #ff4136;
            --primary-glow: rgba(255, 65, 54, 0.4);
            --cpu-color: #00f0ff;
            --gpu-color: #ff0070;
            --mem-color: #ffe600;
            --ux-color: #00ff66;
            --text: #ffffff;
            --text-dim: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 65, 54, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ff4136, #ff725c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .device-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .specs-panel {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .specs-panel span {
            color: var(--text);
            font-weight: 600;
        }

        .score-circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .score-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 10;
        }

        .circle-progress {
            fill: none;
            stroke: url(#scoreGrad);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.3s ease;
        }

        .score-center {
            text-align: center;
            z-index: 2;
        }

        .score-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .score-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .tier-badge {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(255, 65, 54, 0.15);
            color: #ff4136;
            letter-spacing: 0.5px;
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            height: 120px;
            border-radius: 14px;
            overflow: hidden;
            background: #020408;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gpu-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .status-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            background: rgba(0, 0, 0, 0.85);
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #00f0ff;
        }

        .fps-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            background: rgba(0, 0, 0, 0.85);
            padding: 4px 8px;
            border-radius: 6px;
            color: #ff0070;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none;
        }

        .subscores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sub-card {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .sub-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .cpu-t { color: var(--cpu-color); }
        .gpu-t { color: var(--gpu-color); }
        .mem-t { color: var(--mem-color); }
        .ux-t  { color: var(--ux-color); }

        .btn-action {
            width: 100%;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff4136, #e71d36);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 65, 54, 0.6);
        }

        .btn-action:disabled {
            background: #202736;
            box-shadow: none;
            cursor: not-allowed;
            color: #5d6b82;
            transform: none;
        }

        #dom-sandbox {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 300px;
            height: 300px;
            opacity: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            ASEP SCORING v2
        </div>
        <div class="device-badge" id="os-name">Deteksi...</div>
    </header>

    <div class="specs-panel">
        <div>Cores: <span id="cpu-cores">-</span></div>
        <div>RAM: <span id="device-ram">-</span></div>
        <div>Layar: <span id="screen-res">-</span></div>
        <div>Platform: <span id="platform-info">-</span></div>
    </div>

    <div class="score-circle-container">
        <svg class="score-svg" viewBox="0 0 200 200">
            <defs>
                <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff4136" />
                    <stop offset="50%" stop-color="#ff0070" />
                    <stop offset="100%" stop-color="#00f0ff" />
                </linearGradient>
            </defs>
            <circle class="circle-bg" cx="100" cy="100" r="90" />
            <circle class="circle-progress" id="circle-bar" cx="100" cy="100" r="90" />
        </svg>
        <div class="score-center">
            <div class="score-val" id="total-score">0</div>
            <div class="score-label">Total Score</div>
            <div class="tier-badge" id="tier-badge">READY</div>
        </div>
    </div>

    <!-- Viewport for GPU WebGL Stress -->
    <div class="viewport-wrapper">
        <canvas id="gpu-canvas"></canvas>
        <div class="status-overlay" id="test-status">STANDBY</div>
        <div class="fps-overlay" id="fps-counter">0 FPS</div>
    </div>

    <!-- Subscores -->
    <div class="subscores">
        <div class="sub-card">
            <div class="sub-header cpu-t"><span>CPU</span> <span>⚡</span></div>
            <div class="sub-val cpu-t" id="score-cpu">0</div>
        </div>
        <div class="sub-card">
            <div class="sub-header gpu-t"><span>GPU</span> <span>🎮</span></div>
            <div class="sub-val gpu-t" id="score-gpu">0</div>
        </div>
        <div class="sub-card">
            <div class="sub-header mem-t"><span>MEM</span> <span>💾</span></div>
            <div class="sub-val mem-t" id="score-mem">0</div>
        </div>
        <div class="sub-card">
            <div class="sub-header ux-t"><span>UX</span> <span>📱</span></div>
            <div class="sub-val ux-t" id="score-ux">0</div>
        </div>
    </div>

    <button class="btn-action" id="start-btn" onclick="startBenchmark()">RUN HARD STRESS TEST</button>
</div>

<div id="dom-sandbox"></div>

<script>
    // --- Identifikasi Perangkat ---
    document.getElementById('cpu-cores').innerText = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : '4 Cores (Est.)';
    document.getElementById('device-ram').innerText = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : 'N/A';
    document.getElementById('screen-res').innerText = `${Math.round(window.screen.width * window.devicePixelRatio)}x${Math.round(window.screen.height * window.devicePixelRatio)}`;
    
    const ua = navigator.userAgent;
    let platform = "Browser";
    if (/Android/i.test(ua)) platform = "Android";
    else if (/iPhone|iPad|iPod/i.test(ua)) platform = "iOS";
    else if (/Windows/i.test(ua)) platform = "Windows PC";
    else if (/Macintosh/i.test(ua)) platform = "macOS";
    else if (/Linux/i.test(ua)) platform = "Linux PC";
    
    document.getElementById('os-name').innerText = platform;
    document.getElementById('platform-info').innerText = platform;

    const canvas = document.getElementById('gpu-canvas');
    const statusText = document.getElementById('test-status');
    const fpsCounter = document.getElementById('fps-counter');
    const circleBar = document.getElementById('circle-bar');
    const totalCircumference = 2 * Math.PI * 90;

    function setProgress(percent) {
        const offset = totalCircumference - (percent / 100 * totalCircumference);
        circleBar.style.strokeDashoffset = offset;
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function animateCounter(elementId, targetVal, duration = 800) {
        const el = document.getElementById(elementId);
        const startTime = performance.now();
        const startVal = parseInt(el.innerText.replace(/,/g, '')) || 0;

        function update(currentTime) {
            const progress = Math.min((currentTime - startTime) / duration, 1);
            const current = Math.floor(startVal + (targetVal - startVal) * progress);
            el.innerText = current.toLocaleString('id-ID');
            if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    }

    // ==========================================
    // 1. CPU TEST: Mandelbrot + Matrix Mult + Hash
    // ==========================================
    async function testCPU() {
        statusText.innerText = "TESTING: CPU HEAVY MATH";
        await sleep(50);

        const duration = 2600;
        const startTime = performance.now();
        let totalOps = 0;
        let lastYield = performance.now();

        // 1. Mandelbrot Floating Point Math
        const mandelBuffer = new Float64Array(100);
        while (performance.now() - startTime < duration) {
            for (let i = 0; i < 2000; i++) {
                let cr = (i % 100) * 0.03 - 2.0;
                let ci = (i / 100) * 0.03 - 1.5;
                let zr = 0, zi = 0;
                let iter = 0;
                while (zr * zr + zi * zi < 4.0 && iter < 60) {
                    let temp = zr * zr - zi * zi + cr;
                    zi = 2.0 * zr * zi + ci;
                    zr = temp;
                    iter++;
                }
                mandelBuffer[i % 100] = zr;
                totalOps += iter;
            }

            // 2. 32x32 Matrix Multiplication (Cache & ALU stress)
            const A = new Float32Array(1024), B = new Float32Array(1024), C = new Float32Array(1024);
            for (let i = 0; i < 1024; i++) { A[i] = i * 0.1; B[i] = i * 0.2; }
            for (let i = 0; i < 32; i++) {
                for (let j = 0; j < 32; j++) {
                    let sum = 0;
                    for (let k = 0; k < 32; k++) {
                        sum += A[i * 32 + k] * B[k * 32 + j];
                    }
                    C[i * 32 + j] = sum;
                }
            }
            totalOps += 32 * 32 * 32;

            // Kontrol UI yielding tanpa terkena timer clamp 4ms
            if (performance.now() - lastYield > 45) {
                await sleep(0);
                lastYield = performance.now();
            }
        }

        // Formula Skala: Flagship (~400k-550k), Mid (~180k-250k), Redmi 8 (~50k-70k)
        const cpuScore = Math.floor((totalOps / duration) * 7.5);
        return Math.max(cpuScore, 10000);
    }

    // ==========================================
    // 2. GPU TEST: WebGL 3D Raymarching Shader
    // ==========================================
    async function testGPU() {
        statusText.innerText = "TESTING: GPU 3D SHADER";
        fpsCounter.style.display = 'block';
        fpsCounter.innerText = "0 FPS";
        await sleep(50);

        // Pasang resolusi render tinggi sesuai pixel density layar
        const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
        canvas.width = Math.floor(canvas.clientWidth * dpr);
        canvas.height = Math.floor(canvas.clientHeight * dpr);

        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) {
            fpsCounter.style.display = 'none';
            return 30000; // Fallback jika WebGL dimatikan
        }

        const vsSource = `
            attribute vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        // Shader Raymarching Torus 3D Berat dengan dynamic lighting
        const fsSource = `
            precision highp float;
            uniform vec2 u_res;
            uniform float u_time;

            float map(vec3 p) {
                vec3 q = p;
                float c = cos(u_time * 1.5);
                float s = sin(u_time * 1.5);
                q.xz = mat2(c, -s, s, c) * q.xz;
                q.xy = mat2(c, -s, s, c) * q.xy;
                return length(vec2(length(q.xz) - 1.0, q.y)) - 0.35;
            }

            vec3 calcNormal(vec3 p) {
                float h = 0.002;
                vec2 k = vec2(1.0, -1.0);
                return normalize(
                    k.xyy * map(p + k.xyy * h) +
                    k.yyx * map(p + k.yyx * h) +
                    k.yxy * map(p + k.yxy * h) +
                    k.xxx * map(p + k.xxx * h)
                );
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.y, u_res.x);
                vec3 ro = vec3(0.0, 0.0, -3.0);
                vec3 rd = normalize(vec3(uv, 1.2));
                float dO = 0.0;
                vec3 col = vec3(0.04, 0.06, 0.1);

                for (int i = 0; i < 70; i++) {
                    vec3 p = ro + rd * dO;
                    float dS = map(p);
                    dO += dS;
                    if (dO > 15.0 || abs(dS) < 0.002) break;
                }

                if (dO < 15.0) {
                    vec3 p = ro + rd * dO;
                    vec3 n = calcNormal(p);
                    vec3 light = normalize(vec3(1.0, 2.0, -1.5));
                    float diff = max(dot(n, light), 0.15);
                    float spec = pow(max(dot(reflect(-light, n), -rd), 0.0), 16.0);
                    vec3 base = 0.5 + 0.5 * cos(u_time + p.xyx + vec3(0.0, 2.0, 4.0));
                    col = base * diff + vec3(1.0) * spec * 0.7;
                }
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function compileShader(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

        const posAttr = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posAttr);
        gl.vertexAttribPointer(posAttr, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(program, 'u_res');
        const uTime = gl.getUniformLocation(program, 'u_time');
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);

        let frames = 0;
        let lastFpsUpdate = performance.now();
        const duration = 3000;
        const start = performance.now();

        return new Promise(resolve => {
            function render(now) {
                const elapsed = now - start;
                if (elapsed >= duration) {
                    fpsCounter.style.display = 'none';
                    const avgFps = (frames / (elapsed / 1000));
                    // Hitung skor berdasarkan FPS dan jumlah piksel yang dirender
                    const pixelDensityFactor = (canvas.width * canvas.height) / (320 * 120);
                    const gpuScore = Math.floor(avgFps * pixelDensityFactor * 1350);
                    resolve(Math.max(gpuScore, 15000));
                    return;
                }

                // Render 2 pass per frame untuk menghukum GPU bandwidth rendah
                gl.uniform1f(uTime, elapsed * 0.001);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                frames++;
                if (now - lastFpsUpdate > 300) {
                    const currentFps = Math.round((frames / ((now - start) / 1000)));
                    fpsCounter.innerText = `${currentFps} FPS`;
                    lastFpsUpdate = now;
                }
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        });
    }

    // ==========================================
    // 3. MEMORY TEST: True Throughput & Sorting
    // ==========================================
    async function testMEM() {
        statusText.innerText = "TESTING: RAM BANDWIDTH";
        await sleep(50);

        const duration = 2200;
        const start = performance.now();
        let totalMBProcessed = 0;
        let lastYield = performance.now();

        // Alokasikan buffer 16MB (4 juta integer 32-bit)
        const bufferSize = 4000000;
        const memArray = new Uint32Array(bufferSize);

        while (performance.now() - start < duration) {
            // 1. Sequential Write
            for (let i = 0; i < bufferSize; i += 8) {
                memArray[i] = i * 3;
                memArray[i+1] = i * 7;
                memArray[i+2] = i * 11;
                memArray[i+3] = i * 13;
            }
            totalMBProcessed += 16;

            // 2. Non-sequential Cache-strided read/write
            let checksum = 0;
            for (let i = 0; i < bufferSize; i += 64) {
                checksum += memArray[i];
            }
            totalMBProcessed += 4;

            // 3. Quick Float Sort (50k elements)
            const sortArr = new Float64Array(50000);
            for (let i = 0; i < 50000; i++) sortArr[i] = (i * 16807) % 2147483647;
            sortArr.sort();
            totalMBProcessed += 8;

            if (performance.now() - lastYield > 45) {
                await sleep(0);
                lastYield = performance.now();
            }
        }

        // Formula Skala Bandwidth RAM
        const memScore = Math.floor((totalMBProcessed / duration) * 9800);
        return Math.max(memScore, 15000);
    }

    // ==========================================
    // 4. UX TEST: Deep JSON + RegEx + DOM Reflow
    // ==========================================
    async function testUX() {
        statusText.innerText = "TESTING: UX & DOM REFLOW";
        await sleep(50);

        const sandbox = document.getElementById('dom-sandbox');
        const duration = 2000;
        const start = performance.now();
        let uxOps = 0;
        let lastYield = performance.now();

        // 1. Dataset JSON kompleks untuk simulasi real app
        const sampleTree = [];
        for (let i = 0; i < 150; i++) {
            sampleTree.push({ id: i, name: `item_${i}`, meta: { active: true, tags: ['tech', 'bench', 'test'] } });
        }
        const jsonStr = JSON.stringify(sampleTree);

        while (performance.now() - start < duration) {
            // JSON Serialization Stress
            const parsed = JSON.parse(jsonStr);
            parsed.reverse();
            JSON.stringify(parsed);
            uxOps += 20;

            // Heavy RegEx Matching
            const textCorpus = "The quick brown fox jumps over the lazy dog 12345! ".repeat(20);
            const matches = textCorpus.match(/(\b\w{4,}\b)/g);
            uxOps += matches ? matches.length : 0;

            // True DOM Thrashing & Forced Reflow
            const card = document.createElement('div');
            card.style.cssText = `width:${(uxOps % 100) + 50}px; height: 30px; margin: 2px; background: red;`;
            sandbox.appendChild(card);
            
            // Force browser layout engine recalculation
            const reflow = card.getBoundingClientRect().width;
            if (sandbox.children.length > 25) {
                sandbox.innerHTML = '';
            }
            uxOps += 15;

            if (performance.now() - lastYield > 45) {
                await sleep(0);
                lastYield = performance.now();
            }
        }
        sandbox.innerHTML = '';

        const uxScore = Math.floor((uxOps / duration) * 3500);
        return Math.max(uxScore, 12000);
    }

    // --- Main Benchmark Controller ---
    async function startBenchmark() {
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        btn.innerText = "STRESS TESTING IN PROGRESS...";

        ['total-score', 'score-cpu', 'score-gpu', 'score-mem', 'score-ux'].forEach(id => {
            document.getElementById(id).innerText = '0';
        });
        document.getElementById('tier-badge').innerText = 'BENCHMARKING';
        document.getElementById('tier-badge').style.color = '#ff4136';
        setProgress(5);

        // 1. CPU
        const cpuScore = await testCPU();
        animateCounter('score-cpu', cpuScore);
        setProgress(28);

        // 2. GPU
        const gpuScore = await testGPU();
        animateCounter('score-gpu', gpuScore);
        setProgress(58);

        // 3. MEMORY
        const memScore = await testMEM();
        animateCounter('score-mem', memScore);
        setProgress(82);

        // 4. UX & DOM
        const uxScore = await testUX();
        animateCounter('score-ux', uxScore);
        setProgress(100);

        // TOTAL SCORE
        const total = cpuScore + gpuScore + memScore + uxScore;
        animateCounter('total-score', total, 1200);

        // KLASIFIKASI TIER REALISTIS
        const tierBadge = document.getElementById('tier-badge');
        if (total >= 1200000) {
            tierBadge.innerText = 'GOD TIER / FLAGSHIP';
            tierBadge.style.color = '#00f0ff';
            tierBadge.style.background = 'rgba(0, 240, 255, 0.15)';
        } else if (total >= 750000) {
            tierBadge.innerText = 'HIGH-END';
            tierBadge.style.color = '#00ff66';
            tierBadge.style.background = 'rgba(0, 255, 102, 0.15)';
        } else if (total >= 300000) {
            tierBadge.innerText = 'MID-RANGE';
            tierBadge.style.color = '#ffe600';
            tierBadge.style.background = 'rgba(255, 230, 0, 0.15)';
        } else {
            tierBadge.innerText = 'ENTRY LEVEL / BUDGET';
            tierBadge.style.color = '#ff4136';
            tierBadge.style.background = 'rgba(255, 65, 54, 0.15)';
        }

        statusText.innerText = "BENCHMARK COMPLETED";
        btn.disabled = false;
        btn.innerText = "RE-RUN TEST";
    }
</script>

</body>
</html>
