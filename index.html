<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asep Scoring - Raw Hardware Benchmark</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #06080d;
            --card-bg: rgba(15, 20, 32, 0.8);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #ff3344;
            --primary-glow: rgba(255, 51, 68, 0.45);
            --cpu-color: #00f0ff;
            --gpu-color: #ff0077;
            --mem-color: #ffb700;
            --ux-color: #00ff88;
            --text: #f0f4fc;
            --text-dim: #73849e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 51, 68, 0.09) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.08) 0%, transparent 45%);
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 24px;
            backdrop-filter: blur(24px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ff3344, #ff7a6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .device-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .specs-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 22px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .specs-panel span {
            color: var(--text);
            font-weight: 600;
        }

        .score-circle-container {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .score-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.04);
            stroke-width: 9;
        }

        .circle-progress {
            fill: none;
            stroke: url(#scoreGrad);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .score-center {
            text-align: center;
            z-index: 2;
        }

        .score-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px var(--primary-glow);
        }

        .score-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .status-pill {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.68rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            height: 125px;
            border-radius: 16px;
            overflow: hidden;
            background: #020306;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gpu-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .status-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.68rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            background: rgba(4, 7, 12, 0.85);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #00f0ff;
        }

        .fps-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            background: rgba(4, 7, 12, 0.85);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 6px;
            color: #ff0077;
            border: 1px solid rgba(255, 0, 119, 0.3);
            display: none;
            font-weight: 700;
        }

        .subscores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .sub-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            padding: 13px 15px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .sub-card.active {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sub-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .cpu-t { color: var(--cpu-color); }
        .gpu-t { color: var(--gpu-color); }
        .mem-t { color: var(--mem-color); }
        .ux-t  { color: var(--ux-color); }

        .btn-action {
            width: 100%;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff3344, #db143c);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--primary-glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(255, 51, 68, 0.6);
        }

        .btn-action:disabled {
            background: #19202f;
            box-shadow: none;
            cursor: not-allowed;
            color: #4b586e;
            transform: none;
        }

        #dom-sandbox {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 400px;
            height: 400px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            ASEP PRO-BENCH
        </div>
        <div class="device-badge" id="os-name">Detecting...</div>
    </header>

    <div class="specs-panel">
        <div>Cores: <span id="cpu-cores">-</span></div>
        <div>RAM: <span id="device-ram">-</span></div>
        <div>Resolution: <span id="screen-res">-</span></div>
        <div>Platform: <span id="platform-info">-</span></div>
    </div>

    <div class="score-circle-container">
        <svg class="score-svg" viewBox="0 0 200 200">
            <defs>
                <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff3344" />
                    <stop offset="50%" stop-color="#ff0077" />
                    <stop offset="100%" stop-color="#00f0ff" />
                </linearGradient>
            </defs>
            <circle class="circle-bg" cx="100" cy="100" r="90" />
            <circle class="circle-progress" id="circle-bar" cx="100" cy="100" r="90" />
        </svg>
        <div class="score-center">
            <div class="score-val" id="total-score">0</div>
            <div class="score-label">Total Index</div>
            <div class="status-pill" id="status-pill">READY</div>
        </div>
    </div>

    <!-- Viewport GPU Test -->
    <div class="viewport-wrapper">
        <canvas id="gpu-canvas"></canvas>
        <div class="status-overlay" id="test-status">STANDBY</div>
        <div class="fps-overlay" id="fps-counter">0 FPS</div>
    </div>

    <!-- Subscores Grid -->
    <div class="subscores">
        <div class="sub-card" id="card-cpu">
            <div class="sub-header cpu-t"><span>CPU COMPLEX</span> <span>⚡</span></div>
            <div class="sub-val cpu-t" id="score-cpu">0</div>
        </div>
        <div class="sub-card" id="card-gpu">
            <div class="sub-header gpu-t"><span>GPU SHADER</span> <span>🎮</span></div>
            <div class="sub-val gpu-t" id="score-gpu">0</div>
        </div>
        <div class="sub-card" id="card-mem">
            <div class="sub-header mem-t"><span>MEM LATENCY</span> <span>💾</span></div>
            <div class="sub-val mem-t" id="score-mem">0</div>
        </div>
        <div class="sub-card" id="card-ux">
            <div class="sub-header ux-t"><span>ENGINE UX</span> <span>📱</span></div>
            <div class="sub-val ux-t" id="score-ux">0</div>
        </div>
    </div>

    <button class="btn-action" id="start-btn" onclick="startBenchmark()">RUN EXTREME BENCHMARK</button>
</div>

<div id="dom-sandbox"></div>

<script>
    // --- Spesifikasi Hardware Info ---
    document.getElementById('cpu-cores').innerText = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : 'Unknown';
    document.getElementById('device-ram').innerText = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : 'N/A';
    document.getElementById('screen-res').innerText = `${Math.round(window.screen.width * window.devicePixelRatio)}x${Math.round(window.screen.height * window.devicePixelRatio)}`;
    
    const ua = navigator.userAgent;
    let platform = "Browser";
    if (/Android/i.test(ua)) platform = "Android";
    else if (/iPhone|iPad|iPod/i.test(ua)) platform = "iOS";
    else if (/Windows/i.test(ua)) platform = "Windows PC";
    else if (/Macintosh/i.test(ua)) platform = "macOS";
    else if (/Linux/i.test(ua)) platform = "Linux PC";
    
    document.getElementById('os-name').innerText = platform;
    document.getElementById('platform-info').innerText = platform;

    const canvas = document.getElementById('gpu-canvas');
    const statusText = document.getElementById('test-status');
    const statusPill = document.getElementById('status-pill');
    const fpsCounter = document.getElementById('fps-counter');
    const circleBar = document.getElementById('circle-bar');
    const totalCircumference = 2 * Math.PI * 90;

    function setProgress(percent) {
        const offset = totalCircumference - (percent / 100 * totalCircumference);
        circleBar.style.strokeDashoffset = offset;
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Animasi counter super smooth dengan kurva exponential ease-out
    function animateCounter(elementId, targetVal, duration = 1000) {
        const el = document.getElementById(elementId);
        const startTime = performance.now();
        const startVal = parseInt(el.innerText.replace(/\D/g, '')) || 0;

        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // Ease Out Exponential Formula
            const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
            const current = Math.floor(startVal + (targetVal - startVal) * ease);
            el.innerText = current.toLocaleString('id-ID');
            if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    }

    function setActiveCard(cardId) {
        document.querySelectorAll('.sub-card').forEach(c => c.classList.remove('active'));
        if (cardId) document.getElementById(cardId).classList.add('active');
    }

    // =========================================================================
    // 1. CPU TEST: Mandelbrot 64-bit + 64x64 Matrix Multiplications + Bitwise
    // =========================================================================
    async function testCPU() {
        setActiveCard('card-cpu');
        statusText.innerText = "TESTING: CPU ALGORITHM COMPLEXITY";
        await sleep(40);

        const duration = 2800;
        const startTime = performance.now();
        let ops = 0;
        let lastYield = performance.now();

        // 64x64 Matrix Multiplication Arrays
        const size = 64;
        const A = new Float64Array(size * size);
        const B = new Float64Array(size * size);
        const C = new Float64Array(size * size);
        for (let i = 0; i < size * size; i++) {
            A[i] = (i * 0.1337) % 100;
            B[i] = (i * 0.7331) % 100;
        }

        while (performance.now() - startTime < duration) {
            // A. Mandelbrot FP64 Math (Intense Branching)
            for (let i = 0; i < 600; i++) {
                let cr = (i % 30) * 0.08 - 2.1;
                let ci = (i / 30) * 0.08 - 1.2;
                let zr = 0.0, zi = 0.0;
                let iter = 0;
                while (zr * zr + zi * zi < 4.0 && iter < 100) {
                    let temp = zr * zr - zi * zi + cr;
                    zi = 2.0 * zr * zi + ci;
                    zr = temp;
                    iter++;
                }
                ops += iter;
            }

            // B. 64x64 Matrix multiplication (Cache Line Stress & FPU)
            for (let i = 0; i < size; i++) {
                const iOffset = i * size;
                for (let k = 0; k < size; k++) {
                    const aVal = A[iOffset + k];
                    const kOffset = k * size;
                    for (let j = 0; j < size; j++) {
                        C[iOffset + j] += aVal * B[kOffset + j];
                    }
                }
            }
            ops += (size * size * size);

            if (performance.now() - lastYield > 40) {
                await sleep(0);
                lastYield = performance.now();
            }
        }

        // Formula kuadratik proporsional untuk melebarkan jarak prosesor cepat vs lambat
        const opsPerSec = ops / (duration / 1000);
        const finalScore = Math.floor(Math.pow(opsPerSec / 8000, 1.22) * 95);
        return Math.max(finalScore, 5000);
    }

    // =========================================================================
    // 2. GPU TEST: 100-step Heavy WebGL 3D Raymarching & High Density
    // =========================================================================
    async function testGPU() {
        setActiveCard('card-gpu');
        statusText.innerText = "TESTING: GPU RAYMARCHING SHADER";
        fpsCounter.style.display = 'block';
        fpsCounter.innerText = "0 FPS";
        await sleep(40);

        // Skala render dinaikkan hingga 2.0x Device Pixel Ratio
        const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
        canvas.width = Math.floor(canvas.clientWidth * dpr);
        canvas.height = Math.floor(canvas.clientHeight * dpr);

        const gl = canvas.getContext('webgl', { powerPreference: "high-performance", antialias: false });
        if (!gl) {
            fpsCounter.style.display = 'none';
            return 8000;
        }

        const vsSource = `
            attribute vec2 position;
            void main() { gl_Position = vec4(position, 0.0, 1.0); }
        `;

        // Shader 3D Raymarching 100 Iterasi dengan dynamic lights & ambient occlusion
        const fsSource = `
            precision highp float;
            uniform vec2 u_res;
            uniform float u_time;

            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            float map(vec3 p) {
                vec3 q = p;
                float c = cos(u_time * 1.8);
                float s = sin(u_time * 1.8);
                q.xz = mat2(c, -s, s, c) * q.xz;
                q.xy = mat2(c, -s, s, c) * q.xy;
                float torus = length(vec2(length(q.xz) - 1.1, q.y)) - 0.35;
                float sphere = length(p + vec3(sin(u_time * 2.0) * 0.7, 0.0, cos(u_time * 2.0) * 0.7)) - 0.45;
                return smin(torus, sphere, 0.35);
            }

            vec3 calcNormal(vec3 p) {
                float h = 0.001;
                vec2 k = vec2(1.0, -1.0);
                return normalize(
                    k.xyy * map(p + k.xyy * h) +
                    k.yyx * map(p + k.yyx * h) +
                    k.yxy * map(p + k.yxy * h) +
                    k.xxx * map(p + k.xxx * h)
                );
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.y, u_res.x);
                vec3 ro = vec3(0.0, 0.0, -3.2);
                vec3 rd = normalize(vec3(uv, 1.1));
                float dO = 0.0;
                vec3 col = vec3(0.03, 0.05, 0.08);

                for (int i = 0; i < 100; i++) {
                    vec3 p = ro + rd * dO;
                    float dS = map(p);
                    dO += dS;
                    if (dO > 12.0 || abs(dS) < 0.0015) break;
                }

                if (dO < 12.0) {
                    vec3 p = ro + rd * dO;
                    vec3 n = calcNormal(p);
                    vec3 light = normalize(vec3(1.5, 2.5, -2.0));
                    float diff = max(dot(n, light), 0.12);
                    float spec = pow(max(dot(reflect(-light, n), -rd), 0.0), 32.0);
                    vec3 base = 0.5 + 0.5 * cos(u_time + p.xyx + vec3(0.0, 2.0, 4.0));
                    col = base * diff + vec3(1.0) * spec * 0.9;
                }
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function compileShader(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

        const posAttr = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posAttr);
        gl.vertexAttribPointer(posAttr, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(program, 'u_res');
        const uTime = gl.getUniformLocation(program, 'u_time');
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);

        let frames = 0;
        let lastFpsUpdate = performance.now();
        const duration = 3200;
        const start = performance.now();

        return new Promise(resolve => {
            function render(now) {
                const elapsed = now - start;
                if (elapsed >= duration) {
                    fpsCounter.style.display = 'none';
                    const avgFps = frames / (elapsed / 1000);
                    const pixels = canvas.width * canvas.height;
                    // Skor diferensiasi tajam berdasarkan FPS murni dan beban pixel shader
                    const gpuScore = Math.floor(Math.pow(avgFps, 1.35) * (pixels / 14000) * 8.5);
                    resolve(Math.max(gpuScore, 6000));
                    return;
                }

                gl.uniform1f(uTime, elapsed * 0.001);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                frames++;
                if (now - lastFpsUpdate > 250) {
                    const currentFps = Math.round((frames / ((now - start) / 1000)));
                    fpsCounter.innerText = `${currentFps} FPS`;
                    lastFpsUpdate = now;
                }
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        });
    }

    // =========================================================================
    // 3. MEMORY TEST: Non-linear Cache Thrashing & Large Block Sorting
    // =========================================================================
    async function testMEM() {
        setActiveCard('card-mem');
        statusText.innerText = "TESTING: MEMORY BANDWIDTH & CACHE";
        await sleep(40);

        const duration = 2500;
        const start = performance.now();
        let totalCycles = 0;
        let lastYield = performance.now();

        // 32MB Buffer (8 Juta element 32-bit uint) untuk memaksa cache miss
        const bufferLen = 8 * 1024 * 1024;
        const largeMem = new Uint32Array(bufferLen);

        while (performance.now() - start < duration) {
            // A. Cache-strided jumping (Memaksa pembacaan langsung dari DRAM fisik)
            const stride = 1021; // Bilangan prima untuk mencegah L1/L2 prefetching
            let acc = 0;
            for (let i = 0; i < 200000; i++) {
                const idx = (i * stride) & (bufferLen - 1);
                largeMem[idx] = (acc + i) ^ 0x5A5A5A5A;
                acc += largeMem[idx];
            }
            totalCycles += 10;

            // B. Heavy QuickSort (Array 60.000 Float64 acak)
            const sortBuffer = new Float64Array(60000);
            for (let i = 0; i < 60000; i++) sortBuffer[i] = Math.random();
            sortBuffer.sort();
            totalCycles += 25;

            if (performance.now() - lastYield > 40) {
                await sleep(0);
                lastYield = performance.now();
            }
        }

        const scoreMem = Math.floor(Math.pow(totalCycles / (duration / 1000), 1.3) * 620);
        return Math.max(scoreMem, 5000);
    }

    // =========================================================================
    // 4. UX & DOM: Forced Reflow Thrashing & Deep Object Mutation
    // =========================================================================
    async function testUX() {
        setActiveCard('card-ux');
        statusText.innerText = "TESTING: DOM ENGINE & JS RUNTIME";
        await sleep(40);

        const sandbox = document.getElementById('dom-sandbox');
        const duration = 2400;
        const start = performance.now();
        let operations = 0;
        let lastYield = performance.now();

        // Complex deep object creation
        const complexObj = [];
        for (let i = 0; i < 300; i++) {
            complexObj.push({
                uid: `item_${i}`,
                val: i * Math.PI,
                tags: ["stress", "dom", "compute"],
                sub: { active: true, innerVal: i % 7 }
            });
        }
        const strData = JSON.stringify(complexObj);

        while (performance.now() - start < duration) {
            // A. Deep Serialization
            const parsed = JSON.parse(strData);
            parsed.sort((a, b) => b.val - a.val);
            JSON.stringify(parsed);
            operations += 15;

            // B. Forced DOM Layout Thrashing (Memaksa Browser merender ulang layout berkali-kali)
            for (let d = 0; d < 8; d++) {
                const div = document.createElement('div');
                div.style.cssText = `width: ${(operations % 150) + 20}px; height: 18px; padding: 4px; margin: 1px;`;
                sandbox.appendChild(div);
                // Baca layout paksa
                const dummy = div.getBoundingClientRect().width;
            }
            operations += 20;

            if (sandbox.children.length > 50) {
                sandbox.innerHTML = '';
            }

            if (performance.now() - lastYield > 40) {
                await sleep(0);
                lastYield = performance.now();
            }
        }
        sandbox.innerHTML = '';

        const scoreUX = Math.floor(Math.pow(operations / (duration / 1000), 1.25) * 410);
        return Math.max(scoreUX, 5000);
    }

    // =========================================================================
    // MAIN BENCHMARK RUNNER
    // =========================================================================
    async function startBenchmark() {
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        btn.innerText = "BENCHMARK RUNNING...";
        statusPill.innerText = "TESTING";
        statusPill.style.color = "#00f0ff";
        statusPill.style.borderColor = "rgba(0, 240, 255, 0.4)";

        ['total-score', 'score-cpu', 'score-gpu', 'score-mem', 'score-ux'].forEach(id => {
            document.getElementById(id).innerText = '0';
        });
        setProgress(4);

        // 1. CPU
        const cpu = await testCPU();
        animateCounter('score-cpu', cpu);
        setProgress(28);

        // 2. GPU
        const gpu = await testGPU();
        animateCounter('score-gpu', gpu);
        setProgress(58);

        // 3. MEM
        const mem = await testMEM();
        animateCounter('score-mem', mem);
        setProgress(82);

        // 4. UX
        const ux = await testUX();
        animateCounter('score-ux', ux);
        setProgress(100);

        setActiveCard(null);

        // TOTAL SCORE
        const total = cpu + gpu + mem + ux;
        animateCounter('total-score', total, 1400);

        // Selesai murni teknis tanpa badge entry/mid/flagship
        statusPill.innerText = "BENCHMARKED";
        statusPill.style.color = "#00ff88";
        statusPill.style.borderColor = "rgba(0, 255, 136, 0.4)";
        statusText.innerText = "TEST COMPLETE";

        btn.disabled = false;
        btn.innerText = "RE-TEST DEVICE";
    }
</script>
