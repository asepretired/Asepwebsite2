<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTP PANEL</title>
<style>
:root{
  --bg:#05060a;--panel:#0b0e16;--neon:#00e5ff;--pink:#ff2d95;
  --ok:#00ff9d;--err:#ff3b5c;--txt:#c9d1e0;--dim:#5a6478;
}
*{box-sizing:border-box;font-family:'JetBrains Mono','Courier New',monospace}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--txt);
  display:flex;align-items:center;justify-content:center;padding:20px;
  overflow:hidden;
}
/* animated bg */
body::before{
  content:'';position:fixed;inset:-50%;
  background:
    radial-gradient(circle at 20% 30%,rgba(0,229,255,.10),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(255,45,149,.10),transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(0,255,157,.05),transparent 50%);
  animation:drift 18s ease-in-out infinite alternate;
  z-index:0;
}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(3%,-3%) scale(1.1)}
}
.grid-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center,#000 20%,transparent 80%);
}
.card{
  position:relative;z-index:1;
  width:min(420px,100%);
  background:linear-gradient(180deg,rgba(11,14,22,.95),rgba(8,10,16,.95));
  border:1px solid rgba(0,229,255,.18);
  border-radius:20px;
  padding:28px 26px;
  box-shadow:
    0 0 0 1px rgba(0,229,255,.06),
    0 0 40px rgba(0,229,255,.10),
    0 0 80px rgba(255,45,149,.06),
    inset 0 1px 0 rgba(255,255,255,.03);
  backdrop-filter:blur(10px);
}
.title{
  display:flex;align-items:center;gap:10px;margin:0 0 4px;
  font-size:17px;letter-spacing:3px;font-weight:700;
  background:linear-gradient(90deg,var(--neon),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dot{
  width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 10px var(--ok);animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sub{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:22px;text-transform:uppercase}

.field{position:relative;margin-bottom:14px}
label{display:block;font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
input{
  width:100%;padding:14px 14px;background:#070a12;
  border:1px solid #1a2236;border-radius:12px;color:var(--txt);
  font-size:14px;font-family:inherit;outline:none;transition:.25s;
}
input:focus{
  border-color:var(--neon);
  box-shadow:0 0 0 3px rgba(0,229,255,.10),0 0 20px rgba(0,229,255,.15);
  background:#08111a;
}
input::placeholder{color:#3a4154}

button{
  width:100%;padding:15px;border:none;border-radius:12px;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--neon),var(--pink));
  color:#02121a;transition:.25s;
  box-shadow:0 0 20px rgba(0,229,255,.35),0 0 40px rgba(255,45,149,.15);
  margin-top:4px;
}
button:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(0,229,255,.6),0 0 60px rgba(255,45,149,.3)}
button:active{transform:translateY(0)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
button::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transition:.5s;
}
button:not(:disabled):hover::after{left:100%}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin:18px 0 14px;
}
.stat{
  background:#070a12;border:1px solid #141b2c;border-radius:10px;
  padding:10px 8px;text-align:center;transition:.2s;
}
.stat:hover{border-color:rgba(0,229,255,.3)}
.stat .n{font-size:18px;font-weight:800;line-height:1}
.stat .l{font-size:9px;color:var(--dim);letter-spacing:1.5px;margin-top:5px;text-transform:uppercase}
.n.neon{color:var(--neon);text-shadow:0 0 12px rgba(0,229,255,.5)}
.n.ok{color:var(--ok);text-shadow:0 0 12px rgba(0,255,157,.5)}
.n.err{color:var(--err);text-shadow:0 0 12px rgba(255,59,92,.5)}

.console{
  background:#04060a;border:1px solid #121826;border-radius:12px;
  height:170px;overflow-y:auto;padding:12px;font-size:11px;line-height:1.7;
  position:relative;
}
.console::-webkit-scrollbar{width:5px}
.console::-webkit-scrollbar-track{background:transparent}
.console::-webkit-scrollbar-thumb{background:#1c2436;border-radius:3px}
.console::-webkit-scrollbar-thumb:hover{background:var(--neon)}
.le{margin-bottom:2px;opacity:0;animation:fade .3s forwards}
@keyframes fade{to{opacity:1}}
.le .t{color:#3a4154;margin-right:6px}
.le.ok .m{color:var(--ok)}
.le.err .m{color:var(--err)}
.le.info .m{color:var(--neon)}
.le .m{word-break:break-all}

.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  font-size:9px;color:var(--dim);letter-spacing:1.5px;
  text-transform:uppercase;margin-top:12px;padding-top:12px;
  border-top:1px solid #121826;
}
.status-bar .live{display:flex;align-items:center;gap:6px}
.status-bar .live .dot{width:6px;height:6px}
</style>
</head>
<body>
<div class="grid-overlay"></div>

<div class="card">
  <h1 class="title"><span class="dot"></span>OTP PANEL</h1>
  <div class="sub">// sms routing terminal v2.0</div>

  <div class="field">
    <label>Target Number</label>
    <input id="p" placeholder="+628xxxxxxxxxx" autocomplete="off">
  </div>

  <button id="b">⚡ Activate</button>

  <div class="stats">
    <div class="stat"><div class="n neon" id="s_fire">0</div><div class="l">Fired</div></div>
    <div class="stat"><div class="n ok" id="s_ok">0</div><div class="l">Success</div></div>
    <div class="stat"><div class="n err" id="s_err">0</div><div class="l">Failed</div></div>
  </div>

  <div class="console" id="log"></div>

  <div class="status-bar">
    <div class="live"><span class="dot"></span><span>online</span></div>
    <div id="status">idle</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let fired=0,ok=0,fail=0;

function log(m,c='info'){
  const d=document.createElement('div');
  d.className='le '+c;
  const t=new Date().toLocaleTimeString('en-GB',{hour12:false});
  d.innerHTML='<span class="t">['+t+']</span><span class="m">'+m+'</span>';
  $('log').appendChild(d);
  $('log').scrollTop=$('log').scrollHeight;
  if($('log').children.length>200)$('log').removeChild($('log').firstChild);
}

const TARGETS=[
  {n:'MsgRush', f:p=>fetch('https://msgrush-backend-258291301565.us-central1.run.app/api/sms/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({phone:p,message:'Code '+Math.floor(1e5+Math.random()*9e5)})
  }).then(r=>r.text())},
  {n:'Textbelt', f:p=>fetch('https://textbelt.com/text',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({phone:p,message:'Code '+Math.floor(1e5+Math.random()*9e5),key:'textbelt'})
  }).then(r=>r.text())}
];

$('b').onclick=async()=>{
  const phone=$('p').value.trim();
  if(!phone)return log('enter a number','err');
  $('b').disabled=true;
  $('status').textContent='firing...';
  fired=ok=fail=0;
  $('s_fire').textContent=$('s_ok').textContent=$('s_err').textContent='0';

  log('▶ target '+phone,'info');

  for(const t of TARGETS){
    try{
      const r=await t.f(phone);
      fired++;$('s_fire').textContent=fired;
      ok++;$('s_ok').textContent=ok;
      log('✓ '+t.n+' → '+String(r).slice(0,90),'ok');
    }catch(e){
      fired++;$('s_fire').textContent=fired;
      fail++;$('s_err').textContent=fail;
      log('✗ '+t.n+' → '+e.message,'err');
    }
  }

  log('■ done','info');
  $('status').textContent='complete';
  $('b').disabled=false;
};

// enter key
$('p').addEventListener('keydown',e=>{if(e.key==='Enter')$('b').click();});
</script>
</body>
</html>
